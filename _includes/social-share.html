<section class="page__share">
  {% if site.data.ui-text[site.active_lang].share_on_label %}
    <h4 class="page__share-title">{{ site.data.ui-text[site.active_lang].share_on_label | default: "Share on" }}</h4>
  {% endif %}

  <a href="https://twitter.com/intent/tweet?{% if site.twitter.username %}via={{ site.twitter.username | url_encode }}&{% endif %}text={{ page.title | url_encode }}%20{{ page.url | absolute_url | url_encode }}" class="btn btn--twitter" rel="nofollow noopener noreferrer" target="_blank" title="{{ site.data.ui-text[site.active_lang].share_on_label | default: 'Share on' }} Twitter">{% include icon.html name="twitter" %}<span> Twitter</span></a>

  <a href="https://www.facebook.com/sharer/sharer.php?u={{ page.url | absolute_url | url_encode }}" class="btn btn--facebook" rel="nofollow noopener noreferrer" target="_blank" title="{{ site.data.ui-text[site.active_lang].share_on_label | default: 'Share on' }} Facebook">{% include icon.html name="facebook" %}<span> Facebook</span></a>

  <a href="https://www.linkedin.com/shareArticle?mini=true&url={{ page.url | absolute_url | url_encode }}" class="btn btn--linkedin" rel="nofollow noopener noreferrer" target="_blank" title="{{ site.data.ui-text[site.active_lang].share_on_label | default: 'Share on' }} LinkedIn">{% include icon.html name="linkedin" %}<span> LinkedIn</span></a>
</section>
