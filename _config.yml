# Site Footer
footer:
  links:
    - label: "Email Us"
      svg: "envelope"
      url: "mailto:artforumhair@gmail.com"
    - label: "Call Us"
      svg: "phone"
      url: "tel:+359885501340"
    - label: "Location"
      svg: "map-marker"
      url: "https://maps.google.com/?q=Zlatovrah+23+Street,+Sofia,+Bulgaria"

# Reading Files
include:
  - .htaccess
  - _pages
  - _headers
  - robots.txt
  - manifest.json
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/dropdown-menu.js
  - assets/js/vendor
  - assets/css/custom.css
  - assets/css/sidebar-nav.css
  - assets/images/gallery_BACK
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - node_modules
  - package.json
  - package-lock.json
  - Rakefile
  - README
  - tmp
  - /docs # ignore Minimal Mistakes /docs
  - /test # ignore Minimal Mistakes /test
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # https://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style


# Outputting
permalink: /:categories/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
timezone: # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones


# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-polyglot

# mimic GitHub Pages with --safe
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache


# Archives
#  Type
#  - GitHub Pages compatible archive pages built with Liquid ~> type: liquid (default)
#  - Jekyll Archives plugin archive pages ~> type: jekyll-archives
#  Path (examples)
#  - Archive page should exist at path when using Liquid method or you can
#    expect broken links (especially with breadcrumbs enabled)
#  - <base_path>/tags/my-awesome-tag/index.html ~> path: /tags/
#  - <base_path>/categories/my-awesome-category/index.html ~> path: /categories/
#  - <base_path>/my-awesome-category/index.html ~> path: /
#
# NOTE: `path` is intentionally left blank. Setting it makes posts render links
# to /tags/ and /categories/ archive pages, but no such pages exist in _pages/,
# so every one of those links 404s. Only a single post currently carries tags or
# categories, so building archive pages would just create thin duplicate pages.
# To enable archives later: add _pages/{bg,en}/tags.md and categories.md using
# the `tags` / `categories` layouts, then restore the paths below.
category_archive:
  type: liquid
  path:
tag_archive:
  type: liquid
  path:
# https://github.com/jekyll/jekyll-archives
# jekyll-archives:
#   enabled:
#     - categories
#     - tags
#   layouts:
#     category: archive-taxonomy
#     tag: archive-taxonomy
#   permalinks:
#     category: /categories/:name/
#     tag: /tags/:name/


# HTML Compression
# - https://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development

# Custom scripts
# dropdown-menu.js is bundled into assets/js/main.min.js (see package.json "uglify")
after_footer_scripts:



# Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      read_time: false
      comments: false
      share: true
      related: true
  # _pages - add sidebar to all pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: false

# Polyglot Settings
languages: ["bg", "en"]
default_lang: "bg"
exclude_from_localization: ["assets", "node_modules"]
parallel_localization: true